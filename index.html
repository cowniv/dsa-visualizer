<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSA Visualizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>dsa<span>.viz</span></h1>
    <nav>
      <button class="tab active" data-view="sorting">Sorting</button>
      <button class="tab" data-view="structures">Stack &amp; Queue</button>
      <button class="tab" data-view="search">Binary Search</button>
    </nav>
  </header>

  <!-- SORTING -->
  <section id="sorting" class="view active">
    <div class="controls">
      <select id="algo">
        <option value="bubble">Bubble sort</option>
        <option value="selection">Selection sort</option>
        <option value="insertion">Insertion sort</option>
        <option value="merge">Merge sort</option>
        <option value="quick">Quick sort</option>
      </select>
      <label>Size <input type="range" id="size" min="5" max="60" value="25"></label>
      <label>Speed <input type="range" id="speed" min="1" max="100" value="60"></label>
      <button id="shuffle">Shuffle</button>
      <button id="play" class="primary">Play</button>
      <button id="step">Step</button>
    </div>
    <div id="bars" class="bars"></div>
    <div class="stats">
      <span>Steps <b id="stat-steps">0</b></span>
      <span>Comparisons <b id="stat-cmp">0</b></span>
      <span>Swaps / writes <b id="stat-swp">0</b></span>
      <span id="complexity" class="muted"></span>
    </div>
    <p id="sort-msg" class="msg"></p>
  </section>

  <!-- STACK & QUEUE -->
  <section id="structures" class="view">
    <div class="ds-grid">
      <div class="ds-card">
        <h2>Stack <small>LIFO</small></h2>
        <div class="controls">
          <input type="number" id="stack-input" placeholder="value">
          <button id="push" class="primary">Push</button>
          <button id="pop">Pop</button>
          <button id="peek">Peek</button>
        </div>
        <div id="stack" class="stack"></div>
        <p id="stack-msg" class="msg"></p>
      </div>
      <div class="ds-card">
        <h2>Queue <small>FIFO</small></h2>
        <div class="controls">
          <input type="number" id="queue-input" placeholder="value">
          <button id="enqueue" class="primary">Enqueue</button>
          <button id="dequeue">Dequeue</button>
          <button id="front">Front</button>
